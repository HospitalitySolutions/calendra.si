services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      CALENDRA_PUBLIC_SITE_UPSTREAM: ${CALENDRA_PUBLIC_SITE_UPSTREAM:-host.docker.internal:8080}
    volumes:
      - ./Caddyfile.production.alb:/etc/caddy/Caddyfile:ro
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      frontend:
        condition: service_started
      customer-web:
        condition: service_healthy
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    # Images are built by GitHub Actions and published to GHCR. EC2 only pulls them.
    image: ${CALENDRA_IMAGE_REGISTRY:-ghcr.io/hospitalitysolutions}/calendra-backend:${CALENDRA_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 4000
      APP_JWT_EXPIRATION_MS: 86400000
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-central-1}
      AWS_PRODUCTION_SECRET_ID: ${AWS_PRODUCTION_SECRET_ID:-calendra-app}

      # PostgreSQL is managed by AWS RDS in production. The deployment wrapper
      # loads these values from AWS Secrets Manager and exports them only to Compose.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?RDS PostgreSQL JDBC URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?RDS PostgreSQL username is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?RDS PostgreSQL password is required}

      # Redis remains local to this single EC2 production node for now.
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_USERNAME: ""
      SPRING_DATA_REDIS_PASSWORD: ""
      SPRING_DATA_REDIS_SSL_ENABLED: "false"
      APP_RATE_LIMIT_BACKEND: ${APP_RATE_LIMIT_BACKEND:-redis}
      APP_WIDGET_RATE_LIMIT_BACKEND: ${APP_WIDGET_RATE_LIMIT_BACKEND:-redis}
      APP_WORKSPACE_ROLLOUT_SHARED_CLIENTS: ${APP_WORKSPACE_ROLLOUT_SHARED_CLIENTS:-true}
      APP_WORKSPACE_ROLLOUT_CONSOLIDATED_SCHEDULING: ${APP_WORKSPACE_ROLLOUT_CONSOLIDATED_SCHEDULING:-true}
      APP_WORKSPACE_ROLLOUT_CONSOLIDATED_BILLING: ${APP_WORKSPACE_ROLLOUT_CONSOLIDATED_BILLING:-true}
      APP_WORKSPACE_ROLLOUT_SHARED_SERVICES: ${APP_WORKSPACE_ROLLOUT_SHARED_SERVICES:-true}
      APP_WORKSPACE_ROLLOUT_ANALYTICS: ${APP_WORKSPACE_ROLLOUT_ANALYTICS:-true}
      APP_WORKSPACE_ROLLOUT_PUBLIC_BOOKING: ${APP_WORKSPACE_ROLLOUT_PUBLIC_BOOKING:-true}
      APP_WORKSPACE_ROLLOUT_UNIT_MANAGEMENT: ${APP_WORKSPACE_ROLLOUT_UNIT_MANAGEMENT:-true}
      APP_WORKSPACE_INTEGRITY_HEALTH_ENABLED: ${APP_WORKSPACE_INTEGRITY_HEALTH_ENABLED:-true}
      APP_CUSTOMER_WEB_BASE_URL: ${APP_CUSTOMER_WEB_BASE_URL:-https://calendra.si/racun}
      APP_GUEST_AUTH_GOOGLE_CLIENT_ID: ${APP_GUEST_AUTH_GOOGLE_CLIENT_ID:-}
      APP_GUEST_AUTH_GOOGLE_CLIENT_IDS: ${APP_GUEST_AUTH_GOOGLE_CLIENT_IDS:-}
      APP_GUEST_AUTH_APPLE_CLIENT_ID: ${APP_GUEST_AUTH_APPLE_CLIENT_ID:-}
      APP_GUEST_AUTH_APPLE_CLIENT_IDS: ${APP_GUEST_AUTH_APPLE_CLIENT_IDS:-}
      APP_GUEST_AUTH_APPLE_WEB_CLIENT_ID: ${APP_GUEST_AUTH_APPLE_WEB_CLIENT_ID:-}
      APP_GUEST_AUTH_APPLE_WEB_REDIRECT_URI: ${APP_GUEST_AUTH_APPLE_WEB_REDIRECT_URI:-}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=30 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    cpus: ${BACKEND_CPU_LIMIT:-2.0}
    stop_grace_period: 45s
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:4000/api/actuator/health/readiness | grep -q '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    # Built and published by the same GitHub Actions run as the backend image.
    image: ${CALENDRA_IMAGE_REGISTRY:-ghcr.io/hospitalitysolutions}/calendra-frontend:${CALENDRA_IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.5}
    depends_on:
      backend:
        condition: service_healthy

  customer-web:
    image: ${CALENDRA_IMAGE_REGISTRY:-ghcr.io/hospitalitysolutions}/calendra-customer-web:${CALENDRA_IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: ${CUSTOMER_WEB_MEMORY_LIMIT:-256m}
    cpus: ${CUSTOMER_WEB_CPU_LIMIT:-0.35}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1/ | grep -q '/racun/assets/'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
  caddy_data:
  caddy_config:
