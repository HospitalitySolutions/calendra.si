# Profile: staging — public, production-like environment at https://staging.calendra.si.
# Application configuration is loaded from a required AWS Secrets Manager JSON secret.
# The EC2 instance role must allow secretsmanager:GetSecretValue for AWS_STAGING_SECRET_ID.

server:
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_SHUTDOWN_TIMEOUT:30s}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    validate-on-migrate: true
    clean-disabled: true
  datasource:
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:3000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1500000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:300000}
  jpa:
    hibernate:
      ddl-auto: validate
  config:
    # Do not mark this import optional: staging must fail fast if its secret cannot be loaded.
    import: aws-secretsmanager:${AWS_STAGING_SECRET_ID:calendra-staging}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:eu-central-1}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}

app:
  performance:
    slow-request-threshold-ms: ${APP_PERFORMANCE_SLOW_REQUEST_THRESHOLD_MS:500}
  public-base-url: ${APP_PUBLIC_BASE_URL:https://staging.calendra.si}
  demo-booking-public-base-url: ${APP_DEMO_BOOKING_PUBLIC_BASE_URL:https://staging.calendra.si}
  demo-booking-management-base-url: ${APP_DEMO_BOOKING_MANAGEMENT_BASE_URL:${APP_AUTH_FRONTEND_URL:https://staging.calendra.si}}
  workspace-rollout:
    integrity-health-enabled: ${APP_WORKSPACE_INTEGRITY_HEALTH_ENABLED:true}
  bootstrap:
    superadmin:
      enabled: ${APP_BOOTSTRAP_SUPERADMIN_ENABLED:false}
      email: ${APP_BOOTSTRAP_SUPERADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_SUPERADMIN_PASSWORD:}
      first-name: ${APP_BOOTSTRAP_SUPERADMIN_FIRST_NAME:Platform}
      last-name: ${APP_BOOTSTRAP_SUPERADMIN_LAST_NAME:Admin}
      platform-company-name: ${APP_BOOTSTRAP_SUPERADMIN_COMPANY_NAME:Calendra Staging}
  settings:
    encryption-key: ${APP_SETTINGS_ENCRYPTION_KEY:}
  security:
    rate-limit:
      backend: ${APP_RATE_LIMIT_BACKEND:redis}
  auth:
    frontend-url: ${APP_AUTH_FRONTEND_URL:${APP_PUBLIC_BASE_URL:https://staging.calendra.si}}
    cookie:
      name: ${APP_AUTH_COOKIE_NAME:calendra_staging_auth}
      secure: ${APP_AUTH_COOKIE_SECURE:true}
      same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}
      domain: ${APP_AUTH_COOKIE_DOMAIN:}
  webauthn:
    rp-id: ${APP_WEBAUTHN_RP_ID:staging.calendra.si}
    allowed-origins: ${APP_WEBAUTHN_ALLOWED_ORIGINS:https://staging.calendra.si}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://staging.calendra.si}
  widget:
    security:
      require-allowed-origin: ${APP_WIDGET_REQUIRE_ALLOWED_ORIGIN:true}
      trust-referer-when-origin-missing: ${APP_WIDGET_TRUST_REFERER_WHEN_ORIGIN_MISSING:false}
      allowed-origins: ${APP_WIDGET_ALLOWED_ORIGINS:https://staging.calendra.si}
      rate-limit-backend: ${APP_WIDGET_RATE_LIMIT_BACKEND:redis}
    turnstile:
      site-key: ${APP_WIDGET_TURNSTILE_SITE_KEY:}
      secret-key: ${APP_WIDGET_TURNSTILE_SECRET_KEY:}
      required-for-public-actions: ${APP_WIDGET_TURNSTILE_REQUIRED_FOR_PUBLIC_ACTIONS:false}
  google-calendar:
    token-encryption-secret: ${GOOGLE_CALENDAR_TOKEN_ENCRYPTION_SECRET:}
  realtime:
    redis:
      enabled: ${APP_REALTIME_REDIS_ENABLED:true}
      channel: ${APP_REALTIME_REDIS_CHANNEL:calendra:staging:session-bookings:events}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis,workspaceIntegrity
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.example.app: ${LOG_LEVEL_APP:INFO}
