name: calendra-staging

services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_staging_data:/data
      - caddy_staging_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calendra_staging}
      POSTGRES_USER: ${POSTGRES_USER:-calendra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be loaded from AWS Secrets Manager for staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calendra} -d ${POSTGRES_DB:-calendra_staging}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    # Use the same immutable CI-built image format as production.
    # Deploy an exact Git SHA to staging, test it, then promote the same SHA to production.
    image: ${CALENDRA_IMAGE_REGISTRY:-ghcr.io/hospitalitysolutions}/calendra-backend:${CALENDRA_IMAGE_TAG:?CALENDRA_IMAGE_TAG must be an immutable Git SHA}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 4000
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-central-1}
      AWS_STAGING_SECRET_ID: ${AWS_STAGING_SECRET_ID:-calendra-staging}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=30 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    cpus: ${BACKEND_CPU_LIMIT:-2.0}
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:4000/api/actuator/health/readiness | grep -q '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    image: ${CALENDRA_IMAGE_REGISTRY:-ghcr.io/hospitalitysolutions}/calendra-frontend:${CALENDRA_IMAGE_TAG:?CALENDRA_IMAGE_TAG must be an immutable Git SHA}
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.5}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_staging_data:
  redis_staging_data:
  caddy_staging_data:
  caddy_staging_config:
